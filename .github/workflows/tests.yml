name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# lint and test are independent on purpose. They used to be chained with
# `needs: lint`, which meant a formatting failure stopped the suite from
# running at all -- and that is how a ModuleNotFoundError across five test
# modules went unnoticed from February to August 2026. A style nit must never
# be able to hide a broken build.
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # The dev extra, not a bare `pip install black isort`. This job used to
      # install the linters unpinned, so it ran black 26 while pyproject pins
      # black<25 and every other job installs the pins -- code formatted to
      # the declared contract was then rejected by CI, and code CI accepted
      # failed for anyone who had installed .[dev]. The comment below claimed
      # the two could not drift; installing different versions is exactly how
      # they drifted.
      - name: Install linters
        run: pip install -e ".[dev]"

      # Same target, and now the same versions, as a developer who installed
      # the dev extra.
      - name: Lint
        run: make lint

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.9', '3.10', '3.11', '3.12']

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: pip install -e ".[dev]"

      # No marker flags here: the default selection lives in pyproject.toml's
      # addopts, so this runs exactly what a developer's bare `pytest` runs.
      - name: Test
        run: pytest tests/

  # Annotations without a checker rot silently: `x: str = None` had
  # mis-declared four public parameters, and two "pd.DataFrame" return
  # annotations named a module that was never imported. py.typed publishes
  # these annotations to downstream type checkers, so they have to be true.
  #
  # Six modules are excluded via [[tool.mypy.overrides]] in pyproject.toml --
  # a ratchet with 155 remaining errors, not a permanent exemption. The other
  # fourteen are gated here.
  typecheck:
    name: mypy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # The pins, like every other job. mypy and types-requests are in the dev
      # extra precisely so this job and a developer's `make typecheck` cannot
      # resolve different versions and disagree.
      - name: Install
        run: pip install -e ".[dev]"

      - name: Type check
        run: make typecheck

  # A floor, not a target. It exists because hydrolib.batch sat at 0% coverage
  # and shipped an analyze_sites that raised AttributeError for every site,
  # swallowed into {"error": ...} by a bare except -- nothing executed it, so
  # nothing said so.
  #
  # Separate from the test matrix on purpose: coverage is one number, and
  # measuring it four times over four interpreters produces four slightly
  # different ones and no authority about which is the real one. This job
  # installs the app requirements too, so the measurement covers everything the
  # suite can reach.
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install
        run: pip install -e ".[dev]" -r app/requirements.txt

      - name: Test with coverage
        run: make coverage

      - name: Upload the HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-html
          path: htmlcov/
          retention-days: 14

  # app/ had no tests and was not linted, so a Streamlit change could not be
  # reviewed with any confidence -- and that is why dev's app work was left
  # unported. Lint now covers app/ through PKGS in the Makefile; this job adds
  # the missing execution. It is separate from the matrix because Streamlit
  # requires Python >= 3.10 and the matrix still covers 3.9.
  app:
    name: Streamlit app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install
        run: pip install -e ".[dev]" -r app/requirements.txt

      # Same target a developer runs, so the two cannot drift.
      - name: Smoke-test the app
        run: make smoke

  # tests/fortran_parity/test_live_vs_golden.py is the only thing standing
  # between a golden file and silent drift from vendor/peakfqr. It needs the
  # f2py extension, no other job has a Fortran toolchain, so until now it
  # skipped everywhere in CI and drift would surface months later on whichever
  # machine happened to have gfortran. This job gives it one.
  fortran:
    name: Fortran parity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install gfortran
        run: sudo apt-get update && sudo apt-get install -y gfortran

      # meson and ninja are the f2py build backend, not runtime dependencies,
      # so they are installed here rather than added to the dev extra.
      - name: Install
        run: pip install -e ".[dev]" meson ninja

      # Same target a developer runs, so the two cannot drift. It builds, then
      # asserts the extension imports before running the parity tests -- without
      # that assertion a failed build would merely skip them and report green.
      - name: Build and check parity
        run: make parity
