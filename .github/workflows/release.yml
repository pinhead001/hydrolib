name: Release

# Tag-driven. `bump2version <part>` writes the version to pyproject.toml and
# hydrolib/__init__.py and creates the matching tag; pushing that tag is what
# runs this.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  # Everything that can reject the release runs here, before anything is
  # published. A tag is not deletable in practice once people have fetched it,
  # so the checks that matter have to happen while there is still nothing to
  # retract.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install build tooling
        run: pip install build twine

      # .bumpversion.cfg carried current_version = 0.0.3 while every other file
      # said 0.2.0, so `bump2version` could not run at all and the two could
      # drift without anything noticing. This is the check that would have
      # caught it: the tag, the package metadata and the bumpversion state must
      # agree, or there is no release.
      - name: Check the tag matches the package version
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          pkg=$(python -c "import tomllib,pathlib;print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'])")
          cfg=$(python -c "import configparser;c=configparser.ConfigParser();c.read('.bumpversion.cfg');print(c['bumpversion']['current_version'])")
          echo "tag=$tag pyproject=$pkg bumpversion=$cfg"
          if [ "$tag" != "$pkg" ] || [ "$tag" != "$cfg" ]; then
            echo "::error::version mismatch -- tag $tag, pyproject $pkg, .bumpversion.cfg $cfg"
            exit 1
          fi

      - name: Install and test
        run: |
          pip install -e ".[dev]"
          pytest tests/

      - name: Build sdist and wheel
        run: python -m build

      # A wheel that omits py.typed silently disables every annotation
      # downstream, and one that omits the benchmark JSON breaks
      # `hydrolib benchmark` for installed users. Both have happened. Assert the
      # contents rather than trusting the package-data globs.
      - name: Check the artifacts
        run: |
          set -euo pipefail
          twine check dist/*
          wheel=$(ls dist/*.whl)
          python - "$wheel" <<'PY'
          import sys, zipfile
          names = zipfile.ZipFile(sys.argv[1]).namelist()
          required = ["hydrolib/py.typed", "hydrolib/validation/data/big_sandy_03606500.json"]
          missing = [r for r in required if r not in names]
          if missing:
              sys.exit(f"wheel is missing: {missing}")
          if any(n == "setup.py" for n in names):
              sys.exit("wheel contains setup.py, which was deleted as placeholder cruft")
          print(f"wheel contents OK ({len(names)} entries)")
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  github-release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "$GITHUB_REF_NAME" \
            --notes "See CHANGELOG.md for what changed in $GITHUB_REF_NAME." \
            --verify-tag

  # PyPI publishing is deliberately opt-in and will not run until someone
  # configures it, so a tag push cannot publish by accident before the project
  # is ready to be on PyPI.
  #
  # To turn it on: register hydrolib as a PyPI trusted publisher for this
  # repository and workflow, then create a repository environment named `pypi`.
  # Trusted publishing is why there is no API token here -- OIDC issues a
  # short-lived one per run, so there is no long-lived secret to leak.
  pypi:
    needs: build
    runs-on: ubuntu-latest
    if: vars.PUBLISH_TO_PYPI == 'true'
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
