[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hydrolib"
version = "0.2.0"
description = "Python library for hydrologic analysis with Bulletin 17C flood frequency"
readme = "README.md"
authors = [{name = "pinhead001", email = "pinhead001@github.com"}]
license = {text = "MIT"}
requires-python = ">=3.9"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Hydrology",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
keywords = ["hydrology", "flood-frequency", "bulletin-17c", "usgs", "streamflow"]
dependencies = [
    "numpy>=1.20.0",
    "pandas>=1.3.0",
    "matplotlib>=3.4.0",
    "scipy>=1.7.0",
    "requests>=2.25.0",
    "click>=8.0",
    "pyarrow>=10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0,<8",
    "pytest-cov>=4.0,<5",
    "black>=24.0,<25",
    "isort>=5.12,<6",
    "flake8>=6.0,<7",
    "bump2version>=1.0.0,<2",
    "mypy>=1.8,<2",
    # hydrolib.usgs imports requests, which ships no inline annotations. Without
    # the stubs mypy reports the import itself as an error and usgs.py can never
    # be clean, so this is part of the checker, not an optional extra.
    "types-requests",
]

[project.scripts]
hydrolib = "hydrolib.cli:cli"

[tool.setuptools.packages.find]
where = ["."]
include = ["hydrolib*", "data*"]

[tool.setuptools.package-data]
# py.typed is the PEP 561 marker. Without it a downstream type checker ignores
# every annotation in this package, so the type hints are invisible to the
# people they exist for.
"hydrolib" = ["../data/*.csv", "py.typed"]
# Benchmark cases must ship with the package: hydrolib benchmark used to read
# them out of tests/, which is not packaged, so the command failed for every
# installed user.
"hydrolib.validation" = ["data/*.json"]

# Enforcement for the annotations the codebase already carries (210 of 213
# functions). py.typed publishes them; this is what stops them rotting.
#
# The module list below is a RATCHET, not a permanent exemption. Six modules
# carry 155 errors between them and are excluded so the job can gate the other
# fourteen today rather than gate nothing indefinitely. Fix a module, delete its
# line. Never add a line to buy silence on new code -- a module that is off this
# list must stay off it.
[tool.mypy]
files = ["hydrolib"]
# Third-party scientific packages ship uneven annotations; this is about our
# code, not theirs.
ignore_missing_imports = true
warn_unused_configs = true
warn_redundant_casts = true
# `x: str = None` is an error, not an implicit Optional. It had silently
# mis-declared four public parameters across usgs.py and bulletin17c.py.
no_implicit_optional = true

[[tool.mypy.overrides]]
module = [
    "hydrolib",
    "hydrolib.bulletin17c",
    "hydrolib.freq_plot",
    "hydrolib.hydrograph",
    "hydrolib.lowflow",
    "hydrolib.report",
]
ignore_errors = true

[tool.coverage.run]
source = ["hydrolib"]
# The f2py bridge is a generated extension wrapper; there is no Python in it to
# cover, and it is absent unless the Fortran toolchain built it.
omit = ["hydrolib/peakfqr/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

[tool.black]
line-length = 100
target-version = ['py39', 'py310', 'py311', 'py312']

[tool.isort]
profile = "black"
line_length = 100
known_first_party = ["hydrolib"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
# The default selection IS the CI selection, so a bare `pytest` is correct on
# every platform with nothing to remember and no `make` required. Override from
# the CLI when you want the excluded tests: `-m ""` runs everything,
# `-m requires_network` runs only those. A later -m always wins.
#
# requires_peakfqr_testdata is deliberately NOT excluded: the reference data is
# vendored at vendor/peakfqr/inst/testdata, those tests pass, and
# tests/fixtures/paths.py skips them cleanly if it is ever absent.
#
# requires_peakfqsa is gone with hydrolib/peakfqsa: the marker gated two empty
# stub classes, so `pytest -m requires_peakfqsa` collected zero tests and both
# the marker and its exclusion were dead config.
addopts = "-v -m 'not requires_network'"
markers = [
    "requires_network: marks tests that contact live NWIS services (deselect with '-m \"not requires_network\"')",
    "requires_fortran: marks tests needing the f2py Fortran extension (auto-skipped when absent; build with python build_fortran/build.py)",
    "requires_peakfqr_testdata: marks tests needing the peakfqr reference test data, searched under vendor/peakfqr then ../_shared/peakfqr; auto-skipped when absent, see docs/FORTRAN_UPLOAD.md",
]
